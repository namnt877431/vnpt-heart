<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" width="200" height="210">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe8ff"/><stop offset="1" stop-color="#3a8be0"/></linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfdcf0"/></linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a5cf0"/><stop offset="1" stop-color="#3a178a"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <ellipse cx="100" cy="200" rx="84" ry="8" fill="#1f5f1a" opacity=".35"/>
  <rect x="30" y="140" width="140" height="58" rx="8" fill="url(#base)" stroke="#1b4fa8" stroke-width="4"/>
  <g fill="#2f7cf6"><rect x="44" y="154" width="22" height="14" rx="3"/><rect x="134" y="154" width="22" height="14" rx="3"/></g>
  <rect x="86" y="160" width="28" height="38" rx="4" fill="#1446b8" stroke="#0e3585" stroke-width="3"/>
  <!-- glass dome -->
  <path d="M36 142 a64 64 0 0 1 128 0 Z" fill="url(#d)" stroke="#0e3585" stroke-width="4" opacity=".95"/>
  <path d="M58 110 a48 48 0 0 1 36 -26" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" opacity=".7"/>
  <!-- AI chip -->
  <g filter="url(#glow)">
    <rect x="76" y="92" width="48" height="40" rx="8" fill="url(#chip)" stroke="#1d0a4d" stroke-width="3"/>
    <g stroke="#4ee6ff" stroke-width="4" stroke-linecap="round">
      <path d="M84 92 v-8 M100 92 v-8 M116 92 v-8 M84 132 v8 M100 132 v8 M116 132 v8"/>
    </g>
    <path d="M90 122 l6 -20 l6 20 M92 115 h8 M110 102 v20" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- antenna spark -->
  <line x1="100" y1="78" x2="100" y2="40" stroke="#0e3585" stroke-width="4"/>
  <circle cx="100" cy="34" r="8" fill="#4ee6ff" stroke="#0e3585" stroke-width="3" filter="url(#glow)"/>
</svg>
