<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6e4f7"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a9bff"/>
      <stop offset="1" stop-color="#1446b8"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17367d"/>
      <stop offset="1" stop-color="#0a1a44"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- shadow -->
  <ellipse cx="120" cy="290" rx="62" ry="9" fill="#0a2a66" opacity=".25"/>
  <!-- legs -->
  <rect x="86" y="244" width="26" height="36" rx="12" fill="url(#shell)" stroke="#1b4fa8" stroke-width="4"/>
  <rect x="128" y="244" width="26" height="36" rx="12" fill="url(#shell)" stroke="#1b4fa8" stroke-width="4"/>
  <ellipse cx="97" cy="282" rx="20" ry="9" fill="url(#blue)" stroke="#0e3585" stroke-width="3"/>
  <ellipse cx="143" cy="282" rx="20" ry="9" fill="url(#blue)" stroke="#0e3585" stroke-width="3"/>
  <!-- left arm (down) -->
  <rect x="38" y="178" width="30" height="62" rx="15" fill="url(#shell)" stroke="#1b4fa8" stroke-width="4" transform="rotate(14 53 180)"/>
  <circle cx="44" cy="240" r="14" fill="url(#blue)" stroke="#0e3585" stroke-width="3"/>
  <!-- right arm (waving) -->
  <rect x="172" y="120" width="30" height="66" rx="15" fill="url(#shell)" stroke="#1b4fa8" stroke-width="4" transform="rotate(28 187 184)"/>
  <circle cx="214" cy="126" r="15" fill="url(#blue)" stroke="#0e3585" stroke-width="3"/>
  <!-- body -->
  <rect x="60" y="164" width="120" height="92" rx="42" fill="url(#shell)" stroke="#1b4fa8" stroke-width="5"/>
  <circle cx="120" cy="208" r="25" fill="#ffffff" stroke="#2f7cf6" stroke-width="4"/>
  <path d="M120 224 C104 212 100 204 104 197 C108 190 116 191 120 198 C124 191 132 190 136 197 C140 204 136 212 120 224 Z" fill="#e8283b"/>
  <path d="M110 198 q3 -4 7 -2" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- neck -->
  <rect x="100" y="156" width="40" height="14" rx="6" fill="#9fb8dd"/>
  <!-- headphones -->
  <rect x="10" y="70" width="34" height="66" rx="16" fill="url(#blue)" stroke="#0e3585" stroke-width="4"/>
  <rect x="196" y="70" width="34" height="66" rx="16" fill="url(#blue)" stroke="#0e3585" stroke-width="4"/>
  <path d="M30 80 Q30 6 120 6 Q210 6 210 80" stroke="url(#blue)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- head -->
  <rect x="28" y="22" width="184" height="142" rx="66" fill="url(#shell)" stroke="#1b4fa8" stroke-width="5"/>
  <ellipse cx="82" cy="40" rx="34" ry="10" fill="#ffffff" opacity=".9"/>
  <!-- visor -->
  <rect x="50" y="50" width="140" height="92" rx="44" fill="url(#visor)" stroke="#0b2a6b" stroke-width="3"/>
  <path d="M66 70 q20 -14 52 -12" stroke="#3f6fcf" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/>
  <!-- eyes & mouth -->
  <g filter="url(#glow)" stroke="#4ee6ff" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M78 104 q15 -20 30 0"/>
    <path d="M132 104 q15 -20 30 0"/>
    <path d="M106 120 q14 11 28 0" stroke-width="7"/>
  </g>
  <ellipse cx="72" cy="122" rx="9" ry="5" fill="#ff7aa8" opacity=".55"/>
  <ellipse cx="168" cy="122" rx="9" ry="5" fill="#ff7aa8" opacity=".55"/>
</svg>
