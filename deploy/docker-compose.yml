# VNPT Heart: PostgreSQL + API + Caddy (game, admin page, HTTPS).
#   cp deploy/.env.example deploy/.env   # then edit it
#   docker compose -f deploy/docker-compose.yml up -d --build
# See deploy/README.md.
name: vnpt-heart

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vnpt_heart
      POSTGRES_USER: vnpt_heart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vnpt_heart -d vnpt_heart"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://vnpt_heart:${POSTGRES_PASSWORD}@db:5432/vnpt_heart
      UPLOAD_DIR: /data/uploads
      PORT: "3000"
      CLIENT_DIST: ""
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - uploads:/srv-uploads:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
